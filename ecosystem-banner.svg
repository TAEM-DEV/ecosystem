<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6e40c9"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6e40c9;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6e40c9;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="220" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#clip)">
    <rect width="900" height="220" fill="url(#bg)"/>

    <!-- Subtle grid lines -->
    <g stroke="#21262d" stroke-width="0.5" opacity="0.4">
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="100" y1="0" x2="100" y2="220"/>
      <line x1="200" y1="0" x2="200" y2="220"/>
      <line x1="300" y1="0" x2="300" y2="220"/>
      <line x1="400" y1="0" x2="400" y2="220"/>
      <line x1="500" y1="0" x2="500" y2="220"/>
      <line x1="600" y1="0" x2="600" y2="220"/>
      <line x1="700" y1="0" x2="700" y2="220"/>
      <line x1="800" y1="0" x2="800" y2="220"/>
    </g>

    <!-- === Icon Area: Connected Nodes (Pentagon) === -->
    <!-- Pentagon nodes centered around (80, 95) -->
    <!-- Node positions (pentagon, r=40):
         Top:        (80, 55)
         Upper-right:(118, 78)
         Lower-right:(103, 120)
         Lower-left: (57, 120)
         Upper-left: (42, 78)
    -->

    <!-- Connection lines -->
    <g stroke="#6e40c9" stroke-width="1.5" opacity="0.6">
      <!-- Pentagon edges -->
      <line x1="80" y1="55" x2="118" y2="78"/>
      <line x1="118" y1="78" x2="103" y2="120"/>
      <line x1="103" y1="120" x2="57" y2="120"/>
      <line x1="57" y1="120" x2="42" y2="78"/>
      <line x1="42" y1="78" x2="80" y2="55"/>
      <!-- Star (inner connections) -->
      <line x1="80" y1="55" x2="103" y2="120"/>
      <line x1="80" y1="55" x2="57" y2="120"/>
      <line x1="118" y1="78" x2="57" y2="120"/>
      <line x1="118" y1="78" x2="42" y2="78"/>
      <line x1="103" y1="120" x2="42" y2="78"/>
    </g>

    <!-- Animated pulse dots traveling along edges -->
    <!-- Pulse 1: Top -> Upper-right -->
    <circle r="3" fill="url(#pulse-grad)" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath>
          <path d="M80,55 L118,78"/>
        </mpath>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#8b5cf6" opacity="0.9">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath>
          <path d="M80,55 L118,78"/>
        </mpath>
      </animateMotion>
    </circle>

    <!-- Pulse 2: Upper-right -> Lower-right (delayed) -->
    <circle r="3" fill="url(#pulse-grad)" filter="url(#glow)">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="0.6s">
        <mpath>
          <path d="M118,78 L103,120"/>
        </mpath>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle r="2.5" fill="#8b5cf6" opacity="0.9">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="0.6s">
        <mpath>
          <path d="M118,78 L103,120"/>
        </mpath>
      </animateMotion>
    </circle>

    <!-- Pulse 3: Lower-right -> Lower-left (delayed) -->
    <circle r="3" fill="url(#pulse-grad)" filter="url(#glow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.2s">
        <mpath>
          <path d="M103,120 L57,120"/>
        </mpath>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle r="2.5" fill="#8b5cf6" opacity="0.9">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.2s">
        <mpath>
          <path d="M103,120 L57,120"/>
        </mpath>
      </animateMotion>
    </circle>

    <!-- Pulse 4: Lower-left -> Upper-left (delayed) -->
    <circle r="3" fill="url(#pulse-grad)" filter="url(#glow)">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.8s">
        <mpath>
          <path d="M57,120 L42,78"/>
        </mpath>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle r="2.5" fill="#8b5cf6" opacity="0.9">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.8s">
        <mpath>
          <path d="M57,120 L42,78"/>
        </mpath>
      </animateMotion>
    </circle>

    <!-- Pulse 5: Upper-left -> Top (delayed) -->
    <circle r="3" fill="url(#pulse-grad)" filter="url(#glow)">
      <animateMotion dur="2.5s" repeatCount="indefinite" begin="2.4s">
        <mpath>
          <path d="M42,78 L80,55"/>
        </mpath>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" repeatCount="indefinite" begin="2.4s"/>
    </circle>
    <circle r="2.5" fill="#8b5cf6" opacity="0.9">
      <animateMotion dur="2.5s" repeatCount="indefinite" begin="2.4s">
        <mpath>
          <path d="M42,78 L80,55"/>
        </mpath>
      </animateMotion>
    </circle>

    <!-- Pulse along star diagonal: Top -> Lower-right -->
    <circle r="2" fill="#8b5cf6" opacity="0.7">
      <animateMotion dur="4s" repeatCount="indefinite" begin="0.3s">
        <mpath>
          <path d="M80,55 L103,120"/>
        </mpath>
      </animateMotion>
    </circle>

    <!-- Pulse along star diagonal: Upper-right -> Lower-left -->
    <circle r="2" fill="#8b5cf6" opacity="0.7">
      <animateMotion dur="4.2s" repeatCount="indefinite" begin="1.5s">
        <mpath>
          <path d="M118,78 L57,120"/>
        </mpath>
      </animateMotion>
    </circle>

    <!-- Pentagon node circles (on top of lines) -->
    <circle cx="80" cy="55" r="8" fill="#0d1117" stroke="#6e40c9" stroke-width="2" filter="url(#glow)"/>
    <circle cx="80" cy="55" r="4" fill="#8b5cf6" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="118" cy="78" r="8" fill="#0d1117" stroke="#6e40c9" stroke-width="2" filter="url(#glow)"/>
    <circle cx="118" cy="78" r="4" fill="#8b5cf6" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite" begin="0.4s"/>
    </circle>

    <circle cx="103" cy="120" r="8" fill="#0d1117" stroke="#6e40c9" stroke-width="2" filter="url(#glow)"/>
    <circle cx="103" cy="120" r="4" fill="#8b5cf6" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite" begin="0.8s"/>
    </circle>

    <circle cx="57" cy="120" r="8" fill="#0d1117" stroke="#6e40c9" stroke-width="2" filter="url(#glow)"/>
    <circle cx="57" cy="120" r="4" fill="#8b5cf6" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite" begin="1.2s"/>
    </circle>

    <circle cx="42" cy="78" r="8" fill="#0d1117" stroke="#6e40c9" stroke-width="2" filter="url(#glow)"/>
    <circle cx="42" cy="78" r="4" fill="#8b5cf6" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
    </circle>

    <!-- Divider line -->
    <line x1="160" y1="20" x2="160" y2="155" stroke="#30363d" stroke-width="1" opacity="0.6"/>

    <!-- Title -->
    <text x="180" y="62" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="42" font-weight="bold" fill="#f0f6fc">ecosystem</text>

    <!-- Tagline -->
    <text x="180" y="88" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="14" fill="#8b949e">Persistent semantic layer for TAEM missions  &#x2022;  v0.0.1</text>

    <!-- Purple accent bar with animated width -->
    <rect x="180" y="100" width="0" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" from="0" to="460" dur="1.5s" fill="freeze" begin="0.3s"/>
    </rect>

    <!-- Feature pills row -->
    <g transform="translate(180, 118)">
      <!-- Pill: 5 Collections (purple) -->
      <rect x="0" y="0" width="110" height="24" rx="12" fill="#6e40c9" opacity="0.2" stroke="#6e40c9" stroke-width="1"/>
      <text x="55" y="16" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">5 Collections</text>

      <!-- Pill: Qdrant Backend (blue) -->
      <rect x="122" y="0" width="120" height="24" rx="12" fill="#1f6feb" opacity="0.2" stroke="#1f6feb" stroke-width="1"/>
      <text x="182" y="16" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#58a6ff" text-anchor="middle">Qdrant Backend</text>

      <!-- Pill: NAV Cache (green) -->
      <rect x="254" y="0" width="95" height="24" rx="12" fill="#238636" opacity="0.2" stroke="#238636" stroke-width="1"/>
      <text x="301" y="16" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#3fb950" text-anchor="middle">NAV Cache</text>

      <!-- Pill: Semantic Search (yellow) -->
      <rect x="361" y="0" width="130" height="24" rx="12" fill="#b08800" opacity="0.2" stroke="#b08800" stroke-width="1"/>
      <text x="426" y="16" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#d29922" text-anchor="middle">Semantic Search</text>
    </g>

    <!-- Bottom architecture bar -->
    <rect x="0" y="170" width="900" height="50" fill="#161b22"/>
    <line x1="0" y1="170" x2="900" y2="170" stroke="#21262d" stroke-width="1"/>

    <!-- Architecture flow text with pulsing dots -->
    <g transform="translate(30, 198)">
      <!-- Pulsing purple dot 1 -->
      <circle cx="0" cy="-4" r="4" fill="#6e40c9" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      </circle>

      <text x="14" y="0" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" font-weight="bold" fill="#8b5cf6">NAV</text>

      <text x="56" y="0" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#484f58">&#x2192;</text>

      <!-- Pulsing dot 2 -->
      <circle cx="80" cy="-4" r="3" fill="#8b5cf6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.4s"/>
        <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite" begin="0.4s"/>
      </circle>

      <text x="94" y="0" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#8b949e">repo_surfaces</text>

      <text x="230" y="0" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#484f58">&#x2192;</text>

      <!-- Pulsing dot 3 -->
      <circle cx="254" cy="-4" r="3" fill="#8b5cf6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.8s"/>
        <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite" begin="0.8s"/>
      </circle>

      <text x="268" y="0" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#8b949e">Controllers</text>

      <text x="380" y="0" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#484f58">&#x2192;</text>

      <!-- Pulsing dot 4 -->
      <circle cx="404" cy="-4" r="3" fill="#8b5cf6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.2s"/>
        <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite" begin="1.2s"/>
      </circle>

      <text x="418" y="0" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#8b949e">lessons_learned</text>
    </g>

    <!-- Corner badge: v0.0.1 -->
    <rect x="828" y="10" width="60" height="22" rx="6" fill="#6e40c9" opacity="0.25" stroke="#6e40c9" stroke-width="1"/>
    <text x="858" y="25" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">v0.0.1</text>

    <!-- Border -->
    <rect width="900" height="220" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  </g>
</svg>